<!doctype html>
<html lang="pt-BR">
<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Pinhoplay TV</title>

<style>
:root{
--bg:#07090d;
--panel:#10141b;
--card:#151a22;
--line:#252d39;
--text:#f7f8fb;
--muted:#9aa5b4;
--accent:#ff2d3e;
--accent2:#ff6673;
--ok:#22c55e;
--warn:#f59e0b;
--blue:#4f8cff
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
padding-bottom:78px
}

button,input,select{font:inherit}
.hidden{display:none!important}
a{color:inherit}
.shell{min-height:100%}

.topbar{
position:sticky;
top:0;
z-index:40;
display:flex;
align-items:center;
gap:12px;
padding:11px 15px;
background:rgba(7,9,13,.92);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.06)
}

.brand{
font-weight:950;
font-size:24px;
letter-spacing:-.7px;
white-space:nowrap
}

.brand b{color:var(--accent)}

.topActions{
margin-left:auto;
display:flex;
gap:8px
}

.iconBtn{
border:1px solid var(--line);
background:#121722;
color:#fff;
border-radius:12px;
min-width:42px;
height:42px;
cursor:pointer
}

.profile{
width:36px;
height:36px;
border-radius:10px;
background:linear-gradient(135deg,#3151a4,#783d8f);
display:grid;
place-items:center;
font-weight:900
}

.view{display:none}
.view.active{display:block}

.chips{
display:flex;
gap:8px;
overflow-x:auto;
padding:12px 15px 5px;
scrollbar-width:none
}

.chip{
border:1px solid var(--line);
background:#111720;
color:#e7eaf0;
border-radius:999px;
padding:8px 13px;
white-space:nowrap;
cursor:pointer
}

.chip.active{
background:#fff;
color:#111;
border-color:#fff
}

.hero{
min-height:520px;
position:relative;
display:flex;
align-items:flex-end;
padding:40px 18px;
background:
linear-gradient(180deg,rgba(7,9,13,.05) 25%,rgba(7,9,13,.45) 55%,#07090d 100%),
linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.05)),
linear-gradient(135deg,#101c32,#31151d);
}

.heroContent{max-width:680px}

.kicker{
font-size:12px;
letter-spacing:1.5px;
color:#ff9aa3;
font-weight:900
}

.hero h1{
font-size:clamp(38px,8vw,66px);
line-height:.94;
margin:8px 0 12px;
letter-spacing:-2px
}

.hero p{
color:#e1e5eb;
max-width:620px;
line-height:1.5
}

.actions{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:17px
}

.btn{
border:0;
border-radius:10px;
padding:11px 15px;
font-weight:850;
cursor:pointer
}

.primary{
background:#fff;
color:#111
}

.secondary{
background:rgba(255,255,255,.16);
color:#fff;
backdrop-filter:blur(8px)
}

.section{padding:10px 15px 22px}

.sectionHead{
display:flex;
align-items:end;
justify-content:space-between;
gap:12px;
margin:7px 0 11px
}

.sectionHead h2{
margin:0;
font-size:20px;
letter-spacing:-.3px
}

.muted{
color:var(--muted);
font-size:12px
}

.row{
display:grid;
grid-auto-flow:column;
grid-auto-columns:minmax(148px,185px);
gap:10px;
overflow-x:auto;
padding:2px 2px 9px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
overflow:hidden;
cursor:pointer
}

.poster{
aspect-ratio:2/3;
background:#1a202a center/cover;
position:relative
}

.landscape{aspect-ratio:16/9}

.cardBody{padding:9px}

.cardTitle{
font-weight:800;
font-size:13px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.cardMeta{
font-size:11px;
color:var(--muted);
margin-top:3px
}

.badge{
position:absolute;
top:7px;
left:7px;
background:rgba(0,0,0,.74);
border:1px solid rgba(255,255,255,.15);
padding:4px 7px;
border-radius:999px;
font-size:9px;
font-weight:850
}

.badge.ok{background:rgba(16,95,50,.88)}
.badge.warn{background:rgba(137,82,11,.9)}

.pageTitle{padding:24px 15px 5px}

.pageTitle h1{
margin:0 0 5px;
font-size:30px
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
gap:10px;
padding:12px 15px 28px
}

.searchBox{padding:12px 15px}

.searchBox input{
width:100%;
background:#131922;
border:1px solid var(--line);
color:#fff;
border-radius:13px;
padding:13px 14px;
font-size:16px;
outline:none
}

.bottomnav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:50;
display:flex;
overflow-x:auto;
background:rgba(8,10,14,.97);
backdrop-filter:blur(15px);
border-top:1px solid var(--line);
padding:6px 4px calc(6px + env(safe-area-inset-bottom))
}

.bottomnav .navBtn{
flex:0 0 82px;
min-width:82px
}

.navBtn{
background:none;
border:0;
color:#aeb6c2;
font-size:9.5px;
padding:5px 1px;
cursor:pointer
}

.navBtn b{
display:block;
font-size:19px;
margin-bottom:2px
}

.navBtn.active{color:#fff}

/* GAMES */

.gamesHero{
margin:12px 15px;
border-radius:18px;
padding:28px;
min-height:240px;
display:flex;
align-items:flex-end;
background:linear-gradient(135deg,#251044,#0d2438 60%,#35131c)
}

.gamesHero h1{
font-size:40px;
margin:0
}

.gamesGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:11px;
padding:10px 15px 28px
}

.gameCard{
border:1px solid var(--line);
border-radius:14px;
background:var(--card);
overflow:hidden;
cursor:pointer;
transition:.2s
}

.gameCard:focus,
.gameCard:hover{
outline:3px solid #fff;
transform:scale(1.02)
}

.gameThumb{
aspect-ratio:16/9;
display:grid;
place-items:center;
position:relative;
background:linear-gradient(135deg,#171f35,#34153e);
font-size:54px
}

.gameBadge{
position:absolute;
left:8px;
top:8px;
background:#087a50;
padding:5px 8px;
border-radius:999px;
font-size:9px;
font-weight:900
}

.gameBest{
position:absolute;
right:8px;
top:8px;
background:rgba(0,0,0,.72);
padding:5px 8px;
border-radius:999px;
font-size:9px
}

.gameFilters{
display:flex;
gap:8px;
overflow-x:auto;
padding:12px 15px 5px
}

.gameModal{
position:fixed;
inset:0;
z-index:120;
background:#04070b;
display:flex;
flex-direction:column
}

.gameTop{
height:60px;
display:flex;
align-items:center;
gap:8px;
padding:8px 10px;
background:#0d1219;
border-bottom:1px solid var(--line)
}

.gameTop h3{
flex:1;
margin:0
}

.gameTop button{
border:0;
border-radius:10px;
padding:9px 12px;
font-weight:900
}

.gameCanvas{
width:100%;
height:calc(100vh - 60px);
display:block;
background:#07101b;
touch-action:none
}

.gameScore{
font-weight:900;
color:#5ee79b
}

/* PAINEL PRO */

.adminHero{
margin:12px 15px 18px;
padding:26px;
border-radius:22px;
min-height:220px;
display:flex;
align-items:flex-end;
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 82% 15%,rgba(0,204,255,.24),transparent 34%),
radial-gradient(circle at 18% 0,rgba(229,9,20,.24),transparent 34%),
linear-gradient(135deg,#101928,#09111d 60%,#171021);
border:1px solid rgba(255,255,255,.08)
}

.adminHero h1{
font-size:38px;
margin:0 0 6px
}

.adminGrid{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:12px;
padding:0 15px 14px
}

.adminMetric{
padding:16px;
border-radius:16px;
background:linear-gradient(145deg,#131d2a,#0c131e);
border:1px solid var(--line)
}

.adminMetric strong{
display:block;
font-size:30px;
margin:7px 0 2px
}

@media(max-width:700px){
.gamesGrid{grid-template-columns:1fr 1fr}
.gamesHero h1{font-size:31px}
.adminGrid{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:390px){
.gamesGrid{grid-template-columns:1fr}
}
