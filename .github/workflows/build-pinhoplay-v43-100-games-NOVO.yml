name: Gerar APK Pinhoplay TV V43 100 Games NOVO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar index
        run: test -f index_Pinhoplay_V43_100_GAMES_INTERNOS.html || (echo "index_Pinhoplay_V43_100_GAMES_INTERNOS.html nao encontrado" && exit 1)
      - name: Criar Android TV
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/pinhoplay/tv app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets
          cp index_Pinhoplay_V43_100_GAMES_INTERNOS.html app/src/main/assets/index.html
          echo "Baixando pacote MIT com 100 jogos HTML5..."
          rm -rf /tmp/pinhoplay100 /tmp/pinhoplay100.zip
          curl -L --fail --retry 3 -o /tmp/pinhoplay100.zip "https://codeload.github.com/Srikanth-AD/100games/zip/refs/heads/main"
          mkdir -p /tmp/pinhoplay100
          unzip -q /tmp/pinhoplay100.zip -d /tmp/pinhoplay100
          ROOT100="$(find /tmp/pinhoplay100 -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          mkdir -p app/src/main/assets/games100
          cp -R "$ROOT100"/. app/src/main/assets/games100/
          test -f app/src/main/assets/games100/index.html || (echo "ERRO: pacote de games sem index.html" && exit 1)
          COUNT100="$(find app/src/main/assets/games100 -maxdepth 1 -type d -name 'game-*' | wc -l)"
          echo "Games encontrados: $COUNT100"
          test "$COUNT100" -ge 100 || (echo "ERRO: menos de 100 jogos foram copiados" && exit 1)
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="PinhoplayTV"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.pinhoplay.tv'; compileSdk 35; defaultConfig { applicationId "com.pinhoplay.tv"; minSdk 23; targetSdk 35; versionCode 432; versionName "4.3.2" } }
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar"><item name="android:windowFullscreen">true</item><item name="android:windowBackground">#07090d</item><item name="android:navigationBarColor">#07090d</item><item name="android:colorAccent">#e50914</item></style></resources>
          EOF
          cat > app/src/main/res/drawable/pinhoplay_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="512dp" android:height="512dp" android:viewportWidth="512" android:viewportHeight="512"><path android:fillColor="#07090D" android:pathData="M0,0h512v512h-512z"/><path android:fillColor="#E50914" android:pathData="M105,70 L410,256 L105,442 Z"/><path android:fillColor="#FFFFFF" android:pathData="M165,145 L235,145 C320,145 350,195 350,250 C350,310 305,345 240,345 L215,345 L215,395 L165,395 Z M215,195 L215,295 L242,295 C278,295 298,278 298,247 C298,215 278,195 242,195 Z"/></vector>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-feature android:name="android.software.leanback" android:required="false"/><uses-feature android:name="android.hardware.touchscreen" android:required="false"/><application android:allowBackup="false" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:theme="@style/AppTheme" android:label="Pinhoplay" android:icon="@drawable/pinhoplay_icon"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="keyboard|keyboardHidden|orientation|screenSize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#07090d"><WebView android:id="@+id/web" android:layout_width="match_parent" android:layout_height="match_parent" android:focusable="true" android:focusableInTouchMode="true"/></FrameLayout>
          EOF
          cat > app/src/main/java/com/pinhoplay/tv/MainActivity.java <<'EOF'
          package com.pinhoplay.tv;
          import android.app.Activity;import android.os.Bundle;import android.view.KeyEvent;import android.view.Window;import android.view.WindowManager;import android.webkit.WebChromeClient;import android.webkit.WebSettings;import android.webkit.WebView;import android.webkit.WebViewClient;
          public class MainActivity extends Activity{
            private WebView web;
            @Override protected void onCreate(Bundle state){super.onCreate(state);requestWindowFeature(Window.FEATURE_NO_TITLE);getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);setContentView(R.layout.activity_main);web=findViewById(R.id.web);WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setMediaPlaybackRequiresUserGesture(false);s.setAllowFileAccess(true);s.setAllowContentAccess(true);s.setAllowFileAccessFromFileURLs(true);s.setAllowUniversalAccessFromFileURLs(true);s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);s.setLoadWithOverviewMode(true);s.setUseWideViewPort(true);web.setWebChromeClient(new WebChromeClient());web.setWebViewClient(new WebViewClient());web.setFocusable(true);web.setFocusableInTouchMode(true);web.requestFocus();web.loadUrl("file:///android_asset/index.html");}
            private void sendRemote(String action,int keyCode){web.evaluateJavascript("window.postMessage({type:'PINHOPLAY_REMOTE',action:'"+action+"',keyCode:"+keyCode+"},'*');",null);}
            @Override public boolean dispatchKeyEvent(KeyEvent e){if(e.getAction()!=KeyEvent.ACTION_DOWN)return super.dispatchKeyEvent(e);switch(e.getKeyCode()){case KeyEvent.KEYCODE_DPAD_LEFT:sendRemote("left",e.getKeyCode());return super.dispatchKeyEvent(e);case KeyEvent.KEYCODE_DPAD_RIGHT:sendRemote("right",e.getKeyCode());return super.dispatchKeyEvent(e);case KeyEvent.KEYCODE_DPAD_UP:sendRemote("up",e.getKeyCode());return super.dispatchKeyEvent(e);case KeyEvent.KEYCODE_DPAD_DOWN:sendRemote("down",e.getKeyCode());return super.dispatchKeyEvent(e);case KeyEvent.KEYCODE_DPAD_CENTER:case KeyEvent.KEYCODE_ENTER:sendRemote("enter",e.getKeyCode());return super.dispatchKeyEvent(e);case KeyEvent.KEYCODE_BACK:
                  web.evaluateJavascript("(window.pp100CloseFull&&window.pp100CloseFull())?'1':'0'", value -> {
                    if(!"\"1\"".equals(value)){
                      if(web.canGoBack()) web.goBack(); else sendRemote("back",KeyEvent.KEYCODE_BACK);
                    }
                  });
                  return true;default:return super.dispatchKeyEvent(e);}}
          }
          EOF
      - name: Gerar APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Pinhoplay-TV-V43-100-Games-NOVO.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pinhoplay-TV-V43-100-Games-NOVO-APK
          path: Pinhoplay-TV-V43-100-Games-NOVO.apk
