name: Gerar APK Pinhoplay TV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Criar projeto Android TV
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/pinhoplay/tv
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PinhoplayTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pinhoplay.tv'
              compileSdk 35

              defaultConfig {
                  applicationId "com.pinhoplay.tv"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-feature android:name="android.software.leanback" android:required="true"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme"
                  android:label="Pinhoplay"
                  android:banner="@drawable/tv_banner"
                  android:icon="@drawable/app_icon">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <WebView
                  android:id="@+id/web"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:focusable="true"
                  android:focusableInTouchMode="true" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:colorAccent">#e50914</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#E50914" android:pathData="M18,24h16v60h-16zM34,24h14l26,60h-17z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M74,24h16v60h-16z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/tv_banner.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#000000"/>
                  </shape>
              </item>
              <item android:left="30dp" android:right="30dp" android:top="45dp" android:bottom="45dp">
                  <shape android:shape="rectangle">
                      <solid android:color="#E50914"/>
                      <corners android:radius="12dp"/>
                  </shape>
              </item>
          </layer-list>
          EOF

          cat > app/src/main/java/com/pinhoplay/tv/MainActivity.java <<'EOF'
          package com.pinhoplay.tv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String HOME =
                  "https://wpinhoeletricaerefrigeracao-ship-it.github.io/Pinhoplay/";
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  setContentView(R.layout.activity_main);

                  web = findViewById(R.id.web);
                  WebSettings s = web.getSettings();

                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUserAgentString(
                      s.getUserAgentString() + " PinhoplayTV/1.0"
                  );

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient());
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus();
                  web.loadUrl(HOME);
              }

              private void sendRemote(String action, int keyCode) {
                  String js =
                      "window.postMessage({type:'PINHOPLAY_REMOTE',action:'" +
                      action + "',keyCode:" + keyCode + "},'*');";
                  web.evaluateJavascript(js, null);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  if (e.getAction() != KeyEvent.ACTION_DOWN) {
                      return super.dispatchKeyEvent(e);
                  }

                  switch (e.getKeyCode()) {
                      case KeyEvent.KEYCODE_DPAD_LEFT:
                          sendRemote("left", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                          sendRemote("right", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_DPAD_UP:
                          sendRemote("up", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                          sendRemote("down", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                          sendRemote("enter", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PLAY:
                          sendRemote("play", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PAUSE:
                          sendRemote("pause", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                          sendRemote("playpause", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD:
                          sendRemote("fastforward", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_MEDIA_REWIND:
                          sendRemote("rewind", e.getKeyCode());
                          return true;
                      case KeyEvent.KEYCODE_BACK:
                          if (web.canGoBack()) {
                              web.goBack();
                          } else {
                              sendRemote("back", e.getKeyCode());
                          }
                          return true;
                      default:
                          return super.dispatchKeyEvent(e);
                  }
              }
          }
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        run: gradle :app:assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Pinhoplay-TV.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pinhoplay-TV-APK
          path: Pinhoplay-TV.apk
          
